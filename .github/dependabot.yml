# Dependabot – kostenlose Dependency-Updates + Security-Alerts.
# Ersetzt zusammen mit codeql.yml den kostenpflichtigen Anthropic-API-Scan.

version: 2
updates:
  # GitHub-Actions-Versionen (gilt für ALLE Repos, auch ohne package.json).
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'testing'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
    groups:
      # Kein update-types-Filter → Major landet mit im Sammel-PR.
      actions-all:
        patterns:
          - '*'

  # NPM/Yarn/PNPM-Abhängigkeiten.
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'testing'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
    groups:
      # Kein update-types-Filter → Major landet mit im Sammel-PR.
      npm-all:
        patterns:
          - '*'
    # Majors gekoppelter Toolchain aussetzen (Issue project-templates#173): typescript 7 und Expo-/RN-Pakete laufen mit dem SDK, nicht einzeln (PR #297: expo-router 58 vs. expo 57, Typfehler). Per Expo-SDK-Upgrade heben, dann entfernen. react-native ist 0.x – dort ist Minor = Breaking (PR #297: RN 0.87 vs. Expo 57 → RN 0.86.3).
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-native-*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@react-native/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
