name: 'CodeQL'

# Kostenlose statische Code-Analyse (SAST) via GitHub CodeQL.
# Zusammen mit .github/dependabot.yml der Ersatz für den kostenpflichtigen
# Anthropic-API-Scan. build-mode: none — CodeQL analysiert den Quellcode
# direkt, ohne Autobuild (bei RN-/Expo-Projekten schlägt Autobuild sonst fehl).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, testing]
  schedule:
    # Wöchentlicher Full-Scan: fängt neu bekannt gewordene CVEs ohne Code-Änderung.
    - cron: '30 5 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{matrix.language}}'
