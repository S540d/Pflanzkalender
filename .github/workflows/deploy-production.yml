name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build app
        run: npx expo export --platform web --output-dir dist
        env:
          NODE_ENV: production
          CI: true

      - name: Rename assets/node_modules (gets lost on gh-pages deploy)
        run: node scripts/rename-node-modules-assets.js

      - name: Fix paths for GitHub Pages
        run: node scripts/fix-paths.js

      - name: Add service worker and cache-busting
        run: node scripts/add-service-worker.js

      - name: Generate PWA icons
        run: node scripts/generate-icons.js

      - name: Copy icons to dist
        run: cp assets/icon-*.png dist/ || echo "No icons to copy"

      - name: Add PWA meta tags and .well-known
        run: node scripts/add-pwa-meta-tags.js

      - name: Add PWA splash screen
        run: node scripts/add-splash-screen.js

      - name: Create SPA 404 fallback for client-side routing
        run: cp dist/index.html dist/404.html

      - name: Create .nojekyll
        run: touch dist/.nojekyll

      - name: Guard – keine sensiblen Dateien im Deploy-Verzeichnis
        # Ersetzt den früheren Schritt "Cleanup sensitive files from gh-pages".
        # Der hat gh-pages im Build-Workspace ausgecheckt und per `git add -A`
        # gitignorierte Build-Reste (.expo/, dist/, *-deploy/) erst eingecheckt
        # (S540d/S540d.github.io#28). Geprüft wird jetzt VOR dem Upload genau das,
        # was hochgeladen wird.
        run: |
          DIR=./dist
          BAD=$( { find "$DIR" -maxdepth 1 \( -name node_modules -o -name .expo -o -name .git \) ; \
                  find "$DIR" \( -name '.env' -o -name '.env.*' -o -name '*.jks' -o -name '*.keystore' \
                    -o -name '*.p12' -o -name credentials.json -o -name google-services.json \
                    -o -name GoogleService-Info.plist -o -name local.properties \) ; } | head -20)
          if [ -n "$BAD" ]; then
            echo "::error::Sensible Dateien im Deploy-Verzeichnis $DIR:"
            echo "$BAD"
            exit 1
          fi
          echo "✅ Deploy-Verzeichnis $DIR sauber"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: Production deployment'

      - name: Summary
        run: |
          echo "✅ Deployed to production!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Production URL:** https://s540d.github.io/Pflanzkalender/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⏰ **Time:** $(date)" >> $GITHUB_STEP_SUMMARY
